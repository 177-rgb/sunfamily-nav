<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孙氏大家族</title>
<!-- 书法字体 -->
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
/* ========== Design Token System ========== */
:root, [data-theme="light"] {
  --bg-primary: #f8f9fc;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f0f2f5;
  --bg-card: #ffffff;
  --bg-card-hover: #fafbff;
  --bg-tag: #f0f2ff;
  --bg-tag-active: #4f46e5;
  --bg-input: #ffffff;
  --bg-overlay: rgba(0,0,0,0.4);

  --text-primary: #1a1d2e;
  --text-secondary: #6b7194;
  --text-tertiary: #9ca3c8;
  --text-on-accent: #ffffff;
  --text-tag: #4f46e5;
  --text-tag-active: #ffffff;

  --accent-primary: #4f46e5;
  --accent-primary-hover: #4338ca;
  --accent-secondary: #06b6d4;
  --accent-warm: #f59e0b;
  --accent-pink: #ec4899;
  --accent-green: #10b981;
  --accent-red: #ef4444;

  --border-primary: #e5e7f0;
  --border-hover: #c7cbe0;
  --shadow-sm: 0 1px 3px rgba(79,70,229,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md: 0 4px 16px rgba(79,70,229,0.07), 0 2px 6px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 40px rgba(79,70,229,0.10), 0 4px 12px rgba(0,0,0,0.05);
  --shadow-card: 0 2px 8px rgba(79,70,229,0.05);
  --shadow-card-hover: 0 8px 30px rgba(79,70,229,0.12);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  --font-primary: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;

  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;
  --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg-primary: #0f1117;
  --bg-secondary: #181a24;
  --bg-tertiary: #1e2030;
  --bg-card: #1e2030;
  --bg-card-hover: #252840;
  --bg-tag: rgba(79,70,229,0.15);
  --bg-tag-active: #4f46e5;
  --bg-input: #1e2030;
  --bg-overlay: rgba(0,0,0,0.6);

  --text-primary: #e8eaf0;
  --text-secondary: #9499b8;
  --text-tertiary: #5c6180;
  --text-on-accent: #ffffff;
  --text-tag: #a5a0f0;
  --text-tag-active: #ffffff;

  --border-primary: #2a2d42;
  --border-hover: #3d4166;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
  --shadow-card: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-card-hover: 0 8px 30px rgba(79,70,229,0.25);
}

/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-primary);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background var(--transition-normal), color var(--transition-normal);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button { cursor: pointer; border: none; background: none; font-family: inherit; }
input { font-family: inherit; }
a { text-decoration: none; color: inherit; }

/* ========== Scrollbar ========== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* ========== Layout ========== */
.app-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ========== Header ========== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(248,249,252,0.85);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border-bottom: 1px solid var(--border-primary);
  transition: background var(--transition-normal), border-color var(--transition-normal);
}

[data-theme="dark"] .header {
  background: rgba(15,17,23,0.88);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* —— 艺术签名 Logo —— */
.logo {
  display: flex;
  align-items: center;
  gap: 14px;
  user-select: none;
  text-decoration: none;
}

.signature-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

/* 书法签名文字 */
.signature-text {
  font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', '楷体', cursive;
  font-size: 2.4rem;
  line-height: 1.1;
  background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 50%, #ec4899 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: normal;
  letter-spacing: 0.08em;
  filter: drop-shadow(0 2px 3px rgba(79,70,229,0.18));
  transition: filter var(--transition-fast);
}

.signature-text:hover {
  filter: drop-shadow(0 3px 8px rgba(79,70,229,0.28));
}

/* 签名下方装饰线 */
.signature-line {
  width: 100%;
  height: 2px;
  margin-top: 2px;
  border-radius: 1px;
  background: linear-gradient(90deg, #4f46e5, #06b6d4, transparent);
  opacity: 0.5;
}

.signature-sub {
  font-size: 0.68rem;
  color: var(--text-tertiary);
  letter-spacing: 0.14em;
  margin-top: 3px;
  padding-left: 2px;
  font-weight: 500;
  text-transform: uppercase;
}

/*  Logo 图标（备用/装饰） */
.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 1.1rem;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(79,70,229,0.3);
  flex-shrink: 0;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Theme Toggle */
.theme-toggle {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
}

.theme-toggle:hover {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}

.theme-toggle .icon-sun,
.theme-toggle .icon-moon {
  position: absolute;
  transition: transform var(--transition-slow), opacity var(--transition-normal);
}

.theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
.theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); }

[data-theme="dark"] .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }
[data-theme="dark"] .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }

/* ========== Hero / Search ========== */
.hero {
  padding: 44px 0 28px;
  text-align: center;
}

.hero-title {
  font-size: 1.6rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 50%, var(--accent-pink) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}

.hero-subtitle {
  font-size: 0.95rem;
  color: var(--text-secondary);
  margin-bottom: 24px;
}

/* —— 搜索引擎选择器 —— */
.search-engine-bar {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.se-btn {
  padding: 5px 14px;
  border-radius: var(--radius-full);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.se-btn:hover {
  color: var(--accent-primary);
  border-color: var(--border-hover);
  background: var(--bg-tag);
}

.se-btn.active {
  background: var(--bg-tag-active);
  color: var(--text-tag-active);
  border-color: var(--accent-primary);
  box-shadow: 0 2px 8px rgba(79,70,229,0.25);
}

.se-btn .se-icon { font-size: 0.9rem; }

.search-wrapper {
  max-width: 560px;
  margin: 0 auto;
  position: relative;
}

.search-box {
  width: 100%;
  height: 48px;
  padding: 0 80px 0 44px;
  border: 1.5px solid var(--border-primary);
  border-radius: var(--radius-full);
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 0.95rem;
  transition: all var(--transition-normal);
  outline: none;
}

.search-box::placeholder { color: var(--text-tertiary); }

.search-box:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  font-size: 1rem;
  pointer-events: none;
}

.search-go {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  height: 34px;
  padding: 0 14px;
  border-radius: var(--radius-full);
  font-size: 0.8rem;
  font-weight: 600;
  color: white;
  background: var(--accent-primary);
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.search-go:hover {
  background: var(--accent-primary-hover);
  box-shadow: 0 2px 8px rgba(79,70,229,0.3);
}

.search-shortcut {
  position: absolute;
  right: 58px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--bg-tertiary);
  color: var(--text-tertiary);
  font-size: 0.65rem;
  padding: 2px 7px;
  border-radius: 6px;
  font-weight: 600;
  pointer-events: none;
  display: none;
}

/* ========== Category Tabs ========== */
.category-bar {
  padding: 0 0 20px;
  position: sticky;
  top: 64px;
  z-index: 90;
  background: var(--bg-primary);
  transition: background var(--transition-normal);
}

.category-inner {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 16px 0 4px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.category-inner::-webkit-scrollbar { display: none; }

.cat-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  white-space: nowrap;
  transition: all var(--transition-fast);
  user-select: none;
}

.cat-btn:hover {
  color: var(--accent-primary);
  border-color: var(--border-hover);
  background: var(--bg-tag);
}

.cat-btn.active {
  background: var(--bg-tag-active);
  color: var(--text-tag-active);
  border-color: var(--accent-primary);
  box-shadow: 0 2px 8px rgba(79,70,229,0.25);
}

.cat-btn .cat-icon { font-size: 1rem; }

/* ========== Section Header ========== */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.section-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title .title-icon {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
}

/* ========== Website Grid ========== */
.website-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  padding-bottom: 32px;
}

/* ========== Website Card ========== */
.site-card {
  background: var(--bg-card);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-md);
  padding: 20px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  transition: all var(--transition-normal);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.site-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
  opacity: 0;
  transition: opacity var(--transition-normal);
}

.site-card:hover {
  border-color: var(--border-hover);
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-2px);
}

.site-card:hover::before { opacity: 1; }

.site-favicon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
  background: var(--bg-tertiary);
  color: var(--accent-primary);
  font-weight: 700;
  overflow: hidden;
}

.site-favicon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: var(--radius-sm);
}

.site-info { flex: 1; min-width: 0; }

.site-name {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.site-name .badge {
  font-size: 0.6rem;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.badge-hot { background: #fef2f2; color: var(--accent-red); }
.badge-new { background: #f0fdf4; color: var(--accent-green); }
.badge-free { background: #eff6ff; color: var(--accent-primary); }

[data-theme="dark"] .badge-hot { background: rgba(239,68,68,0.15); }
[data-theme="dark"] .badge-new { background: rgba(16,185,129,0.15); }
[data-theme="dark"] .badge-free { background: rgba(79,70,229,0.15); }

.site-desc {
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.site-tags {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.site-tag {
  font-size: 0.65rem;
  padding: 2px 7px;
  border-radius: var(--radius-full);
  background: var(--bg-tag);
  color: var(--text-tag);
  font-weight: 500;
}

.site-actions {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transform: translateX(4px);
  transition: all var(--transition-fast);
}

.site-card:hover .site-actions {
  opacity: 1;
  transform: translateX(0);
}

.btn-icon {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  color: var(--text-tertiary);
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  transition: all var(--transition-fast);
}

.btn-icon:hover {
  color: var(--accent-primary);
  border-color: var(--accent-primary);
  background: var(--bg-tag);
}

.btn-icon.bookmarked {
  color: var(--accent-warm);
  background: #fffbeb;
}

[data-theme="dark"] .btn-icon.bookmarked { background: rgba(245,158,11,0.15); }

/* ========== Favorites Section ========== */
.favorites-section {
  padding: 8px 0 0;
}

.no-favorites {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-tertiary);
  font-size: 0.9rem;
}

.no-favorites .empty-icon {
  font-size: 2.5rem;
  margin-bottom: 12px;
  opacity: 0.5;
}

/* ========== Modal ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-normal);
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  padding: 28px;
  width: 90%;
  max-width: 440px;
  box-shadow: var(--shadow-lg);
  transform: translateY(12px) scale(0.97);
  transition: transform var(--transition-normal);
}

.modal-overlay.active .modal {
  transform: translateY(0) scale(1);
}

.modal-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 20px;
  color: var(--text-primary);
}

.form-group { margin-bottom: 16px; }

.form-label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-input {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 0.9rem;
  transition: border-color var(--transition-fast);
  outline: none;
}

.form-input:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 24px;
}

.btn {
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  transition: all var(--transition-fast);
}

.btn-cancel {
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border-primary);
}

.btn-cancel:hover { background: var(--border-primary); }

.btn-primary {
  background: var(--accent-primary);
  color: white;
}

.btn-primary:hover {
  background: var(--accent-primary-hover);
  box-shadow: 0 2px 8px rgba(79,70,229,0.3);
}

/* ========== Add Category Btn ========== */
.add-cat-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: var(--radius-full);
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--accent-primary);
  background: var(--bg-tag);
  border: 1px dashed var(--accent-primary);
  white-space: nowrap;
  transition: all var(--transition-fast);
}

.add-cat-btn:hover {
  background: var(--accent-primary);
  color: white;
  border-style: solid;
}

/* ========== Footer ========== */
.footer {
  text-align: center;
  padding: 32px 0;
  color: var(--text-tertiary);
  font-size: 0.8rem;
  border-top: 1px solid var(--border-primary);
  margin-top: 16px;
}

/* ========== Animations ========== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.site-card {
  animation: fadeInUp 0.35s ease both;
}

.website-grid .site-card:nth-child(1) { animation-delay: 0.02s; }
.website-grid .site-card:nth-child(2) { animation-delay: 0.04s; }
.website-grid .site-card:nth-child(3) { animation-delay: 0.06s; }
.website-grid .site-card:nth-child(4) { animation-delay: 0.08s; }
.website-grid .site-card:nth-child(5) { animation-delay: 0.10s; }
.website-grid .site-card:nth-child(6) { animation-delay: 0.12s; }
.website-grid .site-card:nth-child(7) { animation-delay: 0.14s; }
.website-grid .site-card:nth-child(8) { animation-delay: 0.16s; }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .hero-title { font-size: 1.3rem; }
  .hero-subtitle { font-size: 0.85rem; }
  .website-grid { grid-template-columns: 1fr; }
  .header-inner { padding: 0 16px; }
  .app-container { padding: 0 16px; }
  .search-box { height: 44px; font-size: 0.9rem; padding-right: 70px; }
  .search-go { padding: 0 10px; font-size: 0.75rem; height: 30px; }
  .signature-text { font-size: 1.8rem; }
  .signature-sub { font-size: 0.6rem; }
}

@media (max-width: 480px) {
  .hero { padding: 28px 0 16px; }
  .cat-btn { padding: 6px 12px; font-size: 0.8rem; }
  .site-card { padding: 16px; }
  .search-engine-bar { gap: 4px; }
  .se-btn { padding: 4px 10px; font-size: 0.72rem; }
}

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg-secondary);
  color: var(--text-primary);
  padding: 10px 20px;
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-primary);
  font-size: 0.85rem;
  font-weight: 500;
  z-index: 2000;
  opacity: 0;
  transition: all var(--transition-normal);
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <!-- 书法艺术签名 -->
      <div class="signature-wrapper">
        <div class="signature-text">孙磊</div>
        <div class="signature-line"></div>
        <span class="signature-sub">孙氏大家族 · 专用导航</span>
      </div>
    </a>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" title="切换主题">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
    </div>
  </div>
</header>

<!-- Main -->
<main class="app-container">

  <!-- Hero / Search -->
  <section class="hero">
    <h1 class="hero-title">孙氏大家族 · 专用导航</h1>
    <p class="hero-subtitle">设计 · 开发 · 效率 · 学习 · AI — 家族专属实用网站导航</p>

    <!-- 搜索引擎选择 -->
    <div class="search-engine-bar" id="engineBar">
      <button class="se-btn active" data-engine="google">🔍 Google</button>
      <button class="se-btn" data-engine="bing">🔎 Bing</button>
      <button class="se-btn" data-engine="baidu">🟡 百度</button>
      <button class="se-btn" data-engine="github">🐙 GitHub</button>
      <button class="se-btn" data-engine="chatgpt">💬 ChatGPT</button>
    </div>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-box" id="searchInput" placeholder="搜索网站，或输入关键词进行网页搜索…（孙氏大家族专用）" />
      <button class="search-go" id="searchGoBtn">搜索</button>
    </div>
  </section>

  <!-- Category Tabs -->
  <nav class="category-bar">
    <div class="category-inner" id="categoryBar">
      <button class="cat-btn active" data-cat="all">🌐 <span>全部</span></button>
      <button class="cat-btn" data-cat="design">🎨 <span>设计资源</span></button>
      <button class="cat-btn" data-cat="dev">⚡ <span>开发工具</span></button>
      <button class="cat-btn" data-cat="productivity">📋 <span>效率工具</span></button>
      <button class="cat-btn" data-cat="learn">📚 <span>学习资源</span></button>
      <button class="cat-btn" data-cat="ai">🤖 <span>AI 工具</span></button>
      <button class="cat-btn" data-cat="favorites">⭐ <span>我的收藏</span></button>
    </div>
  </nav>

  <!-- Favorites Section -->
  <section class="favorites-section" id="favoritesSection" style="display:none;">
    <div class="section-header">
      <h2 class="section-title"><span class="title-icon" style="background:#fffbeb;color:var(--accent-warm);">⭐</span> 我的收藏</h2>
    </div>
    <div class="website-grid" id="favoritesGrid"></div>
    <div class="no-favorites" id="noFavorites">
      <div class="empty-icon">☆</div>
      <p>还没有收藏任何网站<br>点击卡片右上角的 ☆ 即可收藏</p>
    </div>
  </section>

  <!-- Website Grid -->
  <section id="mainGridSection">
    <div class="website-grid" id="websiteGrid"></div>
  </section>

</main>

<!-- Add Site Modal -->
<div class="modal-overlay" id="addSiteModal">
  <div class="modal">
    <h3 class="modal-title">添加自定义网站</h3>
    <div class="form-group">
      <label class="form-label">网站名称</label>
      <input type="text" class="form-input" id="siteNameInput" placeholder="例如：Figma" />
    </div>
    <div class="form-group">
      <label class="form-label">网址（URL）</label>
      <input type="text" class="form-input" id="siteUrlInput" placeholder="https://..." />
    </div>
    <div class="form-group">
      <label class="form-label">简介</label>
      <input type="text" class="form-input" id="siteDescInput" placeholder="一句话描述这个网站" />
    </div>
    <div class="form-group">
      <label class="form-label">分类</label>
      <select class="form-input" id="siteCatInput">
        <option value="design">设计资源</option>
        <option value="dev">开发工具</option>
        <option value="productivity">效率工具</option>
        <option value="learn">学习资源</option>
        <option value="ai">AI 工具</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeAddSiteModal()">取消</button>
      <button class="btn btn-primary" onclick="submitAddSite()">添加网站</button>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="footer">
  <p>孙氏大家族 · 专用导航 © 2026 · 数据仅在本地保存</p>
</footer>

<script>
/* ========== 搜索引擎配置 ========== */
const engines = {
  google:   { name: "Google",   url: "https://www.google.com/search?q={q}" },
  bing:     { name: "Bing",     url: "https://www.bing.com/search?q={q}" },
  baidu:    { name: "百度",     url: "https://www.baidu.com/s?wd={q}" },
  github:   { name: "GitHub",   url: "https://github.com/search?q={q}&type=repositories" },
  chatgpt:  { name: "ChatGPT",  url: "https://chat.openai.com/?q={q}" },
};

let currentEngine = "google";

/* ========== Site Data ========== */
const siteData = [
  // —— 设计资源 ——
  { name: "Coolors", url: "https://coolors.co", desc: "配色方案生成器，一键生成完美配色", cat: "design", icon: "🎨", badge: "hot", tags: ["配色","色彩"] },
  { name: "FontPair", url: "https://fontpair.co", desc: "Google Fonts 字体搭配推荐", cat: "design", icon: "🔤", badge: "", tags: ["字体","排版"] },
  { name: "Iconify", url: "https://iconify.design", desc: "200+ 图标集，一键搜索复制", cat: "design", icon: "🧩", badge: "free", tags: ["图标","SVG"] },
  { name: "Dribbble", url: "https://dribbble.com", desc: "全球设计师作品灵感社区", cat: "design", icon: "🏀", badge: "", tags: ["灵感","作品集"] },
  { name: "UI Gradient", url: "https://uigradients.com", desc: "精美渐变背景色合集", cat: "design", icon: "🌈", badge: "free", tags: ["渐变","背景"] },
  { name: "Unsplash", url: "https://unsplash.com", desc: "高清无版权图片素材库", cat: "design", icon: "📷", badge: "free", tags: ["图片","素材"] },
  { name: "Figma Community", url: "https://figma.com/community", desc: "Figma 免费设计资源社区", cat: "design", icon: "🎯", badge: "hot", tags: ["Figma","UI Kit"] },

  // —— 开发工具 ——
  { name: "GitHub", url: "https://github.com", desc: "全球最大代码托管平台", cat: "dev", icon: "🐙", badge: "hot", tags: ["代码","Git"] },
  { name: "MDN Web Docs", url: "https://developer.mozilla.org", desc: "最权威的 Web 开发文档", cat: "dev", icon: "📖", badge: "free", tags: ["文档","Web"] },
  { name: "Postman", url: "https://postman.com", desc: "API 接口调试与测试工具", cat: "dev", icon: "🚀", badge: "", tags: ["API","测试"] },
  { name: "RegExr", url: "https://regexr.com", desc: "正则表达式在线测试和学习", cat: "dev", icon: "📝", badge: "free", tags: ["正则","工具"] },
  { name: "Can I Use", url: "https://caniuse.com", desc: "浏览器兼容性查询", cat: "dev", icon: "✅", badge: "", tags: ["兼容性","CSS"] },
  { name: "Bundlephobia", url: "https://bundlephobia.com", desc: "查询 npm 包体积大小", cat: "dev", icon: "📦", badge: "", tags: ["npm","性能"] },
  { name: "CodePen", url: "https://codepen.io", desc: "在线前端代码编辑与展示", cat: "dev", icon: "✏️", badge: "free", tags: ["前端","演示"] },

  // —— 效率工具 ——
  { name: "Notion", url: "https://notion.so", desc: "一体化笔记、文档与项目管理", cat: "productivity", icon: "📝", badge: "hot", tags: ["笔记","协作"] },
  { name: "Todoist", url: "https://todoist.com", desc: "跨平台任务与待办管理", cat: "productivity", icon: "✅", badge: "", tags: ["待办","GTD"] },
  { name: "Calendly", url: "https://calendly.com", desc: "智能会议预约 scheduling 工具", cat: "productivity", icon: "📅", badge: "", tags: ["日历","预约"] },
  { name: "Motion", url: "https://motion.me", desc: "AI 自动规划你的日程与任务", cat: "productivity", icon: "🤖", badge: "new", tags: ["AI","日程"] },
  { name: "Smallpdf", url: "https://smallpdf.com", desc: "PDF 压缩、转换、合并在线工具", cat: "productivity", icon: "📄", badge: "", tags: ["PDF","工具"] },
  { name: "Trello", url: "https://trello.com", desc: "看板式任务管理与团队协作", cat: "productivity", icon: "📋", badge: "", tags: ["看板","协作"] },

  // —— 学习资源 ——
  { name: "freeCodeCamp", url: "https://freecodecamp.org", desc: "免费学习编程，从零到全栈", cat: "learn", icon: "⛺", badge: "free", tags: ["编程","免费"] },
  { name: "Coursera", url: "https://coursera.org", desc: "全球顶尖大学在线课程平台", cat: "learn", icon: "🎓", badge: "", tags: ["课程","大学"] },
  { name: "MDN Learning", url: "https://developer.mozilla.org/zh-CN/docs/Learn", desc: "Mozilla 出品的 Web 开发入门教程", cat: "learn", icon: "🌐", badge: "free", tags: ["Web","教程"] },
  { name: "LeetCode", url: "https://leetcode.com", desc: "算法刷题与面试准备平台", cat: "learn", icon: "💡", badge: "hot", tags: ["算法","面试"] },
  { name: "DevDocs", url: "https://devdocs.io", desc: "多语言开发文档聚合搜索", cat: "learn", icon: "📚", badge: "free", tags: ["文档","API"] },
  { name: "W3Schools", url: "https://w3schools.com", desc: "Web 技术在线教程与参考", cat: "learn", icon: "🌟", badge: "", tags: ["教程","Web"] },

  // —— AI 工具 ——
  { name: "ChatGPT", url: "https://chat.openai.com", desc: "OpenAI 旗舰对话 AI，写作编程全能", cat: "ai", icon: "💬", badge: "hot", tags: ["对话","写作"] },
  { name: "Midjourney", url: "https://midjourney.com", desc: "顶级 AI 图像生成工具", cat: "ai", icon: "🖼️", badge: "hot", tags: ["图像","生成"] },
  { name: "Claude", url: "https://claude.ai", desc: "Anthropic 安全 AI 助手，长文本处理", cat: "ai", icon: "🫎", badge: "new", tags: ["对话","长文本"] },
  { name: "Hugging Face", url: "https://huggingface.co", desc: "开源 AI 模型与数据集社区", cat: "ai", icon: "🤗", badge: "", tags: ["模型","开源"] },
  { name: "Gamma", url: "https://gamma.app", desc: "AI 一键生成 PPT 和文档", cat: "ai", icon: "🎯", badge: "new", tags: ["PPT","文档"] },
  { name: "Perplexity", url: "https://perplexity.ai", desc: "AI 搜索引擎，答案附带来源", cat: "ai", icon: "🔍", badge: "", tags: ["搜索","AI"] },
  { name: "Remove.bg", url: "https://remove.bg", desc: "AI 一键抠图，秒级去背景", cat: "ai", icon: "✂️", badge: "", tags: ["抠图","图像"] },
];

/* ========== State ========== */
let currentCat = "all";
let bookmarks = JSON.parse(localStorage.getItem("navhub_bookmarks") || "[]");
let customSites = JSON.parse(localStorage.getItem("navhub_custom") || "[]");

/* ========== Init ========== */
document.addEventListener("DOMContentLoaded", () => {
  const savedTheme = localStorage.getItem("navhub_theme") || "light";
  document.documentElement.setAttribute("data-theme", savedTheme);
  renderGrid();
  bindEvents();
});

/* ========== Events ========== */
function bindEvents() {
  // Engine switch
  document.getElementById("engineBar").addEventListener("click", (e) => {
    const btn = e.target.closest(".se-btn");
    if (!btn) return;
    document.querySelectorAll(".se-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentEngine = btn.dataset.engine;
  });

  // Search input: live filter
  document.getElementById("searchInput").addEventListener("input", (e) => {
    renderGrid(e.target.value.toLowerCase());
  });

  // Search: Enter key → web search; also wire the go button
  document.getElementById("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      doWebSearch();
    }
  });
  document.getElementById("searchGoBtn").addEventListener("click", doWebSearch);

  // Theme toggle
  document.getElementById("themeToggle").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("navhub_theme", next);
  });

  // Category switch
  document.getElementById("categoryBar").addEventListener("click", (e) => {
    const btn = e.target.closest(".cat-btn");
    if (!btn) return;
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    renderGrid(document.getElementById("searchInput").value.toLowerCase());
  });
}

/* ========== Web Search ========== */
function doWebSearch() {
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;
  const engine = engines[currentEngine];
  const url = engine.url.replace("{q}", encodeURIComponent(q));
  window.open(url, "_blank");
}

/* ========== Render ========== */
function renderGrid(query = "") {
  const grid = document.getElementById("websiteGrid");
  const favSection = document.getElementById("favoritesSection");
  const mainSection = document.getElementById("mainGridSection");

  if (currentCat === "favorites") {
    favSection.style.display = "";
    mainSection.style.display = "none";
    renderFavorites();
    return;
  } else {
    favSection.style.display = "none";
    mainSection.style.display = "";
  }

  const allSites = [...siteData, ...customSites];
  const filtered = allSites.filter(site => {
    const matchCat = currentCat === "all" || site.cat === currentCat;
    const matchSearch = !query ||
      site.name.toLowerCase().includes(query) ||
      site.desc.toLowerCase().includes(query) ||
      site.tags.some(t => t.toLowerCase().includes(query));
    return matchCat && matchSearch;
  });

  if (filtered.length === 0) {
    const engine = engines[currentEngine];
    grid.innerHTML = `      <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-tertiary);">
        <div style="font-size:3rem;margin-bottom:12px;opacity:0.4;">🔍</div>
        <p style="margin-bottom:8px;">没有找到匹配的网站</p>
        <p style="font-size:0.8rem;margin-bottom:12px;">孙氏大家族专用导航 · 在搜索引擎中继续查找</p>
        <button onclick="doWebSearch()" style="
          margin-top:8px;
          padding:8px 18px;
          border-radius:var(--radius-full);
          background:var(--accent-primary);
          color:white;
          font-size:0.85rem;
          font-weight:600;
          border:none;
          cursor:pointer;
        ">在 ${engine.name} 中搜索"${query}"</button>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(site => cardHTML(site)).join("");
}

function renderFavorites() {
  const grid = document.getElementById("favoritesGrid");
  const empty = document.getElementById("noFavorites");
  const allSites = [...siteData, ...customSites];
  const favSites = allSites.filter(s => bookmarks.includes(s.name));

  if (favSites.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "";
    return;
  }

  empty.style.display = "none";
  grid.innerHTML = favSites.map(site => cardHTML(site)).join("");
}

function cardHTML(site) {
  const isBookmarked = bookmarks.includes(site.name);
  const badgeHTML = site.badge ? `<span class="badge badge-${site.badge}">${
    site.badge === "hot" ? "热门" : site.badge === "new" ? "新" : "免费"
  }</span>` : "";

  const tagsHTML = site.tags.map(t => `<span class="site-tag">${t}</span>`).join("");

  const faviconContent = site.icon && !site.icon.includes("/")
    ? `<span>${site.icon}</span>`
    : `<span>${site.name.charAt(0)}</span>`;

  return `
    <div class="site-card" onclick="window.open('${site.url}','_blank')">
      <div class="site-favicon">${faviconContent}</div>
      <div class="site-info">
        <div class="site-name">${site.name} ${badgeHTML}</div>
        <div class="site-desc">${site.desc}</div>
        <div class="site-tags">${tagsHTML}</div>
      </div>
      <div class="site-actions">
        <button class="btn-icon ${isBookmarked ? 'bookmarked' : ''}"
          title="${isBookmarked ? '取消收藏' : '收藏'}"
          onclick="event.stopPropagation();toggleBookmark('${site.name}')">
          ${isBookmarked ? '★' : '☆'}
        </button>
        ${site.custom ? `<button class="btn-icon" title="删除" onclick="event.stopPropagation();deleteCustomSite('${site.name}')">✕</button>` : ""}
      </div>
    </div>
  `;
}

/* ========== Bookmarks ========== */
function toggleBookmark(name) {
  const idx = bookmarks.indexOf(name);
  if (idx === -1) {
    bookmarks.push(name);
    showToast(`★ 已收藏「${name}」`);
  } else {
    bookmarks.splice(idx, 1);
    showToast(`已取消收藏「${name}」`);
  }
  localStorage.setItem("navhub_bookmarks", JSON.stringify(bookmarks));
  renderGrid(document.getElementById("searchInput").value.toLowerCase());
  if (currentCat === "favorites") renderFavorites();
}

/* ========== Custom Sites ========== */
function openAddSiteModal() {
  document.getElementById("addSiteModal").classList.add("active");
}

function closeAddSiteModal() {
  document.getElementById("addSiteModal").classList.remove("active");
  document.getElementById("siteNameInput").value = "";
  document.getElementById("siteUrlInput").value = "";
  document.getElementById("siteDescInput").value = "";
}

function submitAddSite() {
  const name = document.getElementById("siteNameInput").value.trim();
  const url = document.getElementById("siteUrlInput").value.trim();
  const desc = document.getElementById("siteDescInput").value.trim();
  const cat = document.getElementById("siteCatInput").value;

  if (!name || !url) { showToast("请填写网站名称和网址"); return; }

  customSites.push({
    name, url, desc: desc || "自定义网站", cat, icon: "🔗", badge: "new", tags: ["自定义"], custom: true
  });

  localStorage.setItem("navhub_custom", JSON.stringify(customSites));
  closeAddSiteModal();
  renderGrid();
  showToast(`✅ 已添加「${name}」`);
}

function deleteCustomSite(name) {
  if (!confirm(`确定删除「${name}」？`)) return;
  customSites = customSites.filter(s => s.name !== name);
  bookmarks = bookmarks.filter(b => b !== name);
  localStorage.setItem("navhub_custom", JSON.stringify(customSites));
  localStorage.setItem("navhub_bookmarks", JSON.stringify(bookmarks));
  renderGrid(document.getElementById("searchInput").value.toLowerCase());
  showToast(`已删除「${name}」`);
}

/* ========== Toast ========== */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

/* ========== Expose for category bar custom button ========== */
const catInner = document.getElementById("categoryBar");
const addBtn = document.createElement("button");
addBtn.className = "add-cat-btn";
addBtn.innerHTML = "＋ 添加网站";
addBtn.onclick = openAddSiteModal;
catInner.appendChild(addBtn);
</script>
</body>
</html>
